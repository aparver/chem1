<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chem 1 • Study & Practice</title><style>
:root{color-scheme:light;--ink:#19334a;--teal:#147d79;--bg:#f1f6f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,sans-serif}header{background:var(--ink);color:white;padding:32px 20px}header>div,main{max-width:850px;margin:auto}h1{margin:0;font-size:clamp(28px,6vw,42px)}header p{margin:7px 0;opacity:.85}main{padding:24px 16px 50px}nav{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px}button,select{font:inherit;border-radius:12px;padding:11px 17px;border:1px solid #c3d4dc;background:white;color:var(--ink);cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #e4a328;outline-offset:3px}button.active,.primary{background:var(--teal);color:white;border-color:var(--teal)}button:disabled{cursor:default;opacity:.7}.card{background:white;border:1px solid #dbe5ea;border-radius:20px;padding:24px;margin:15px 0;box-shadow:0 7px 24px #19334a08}h2,h3{line-height:1.25}h2{margin:10px 0 20px}.muted{color:#587084;font-size:15px}.options{display:grid;gap:12px}.options button{text-align:left;min-height:55px}.options .good{background:#e1f5eb;border:2px solid #218352}.options .bad{background:#fff0ed;border:2px solid #b34232}.feedback{border-radius:12px;padding:15px;background:#eff5f7;margin:18px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}progress{width:100%;height:13px;accent-color:var(--teal)}.pill{font-size:13px;background:#e4f0f0;color:var(--teal);padding:4px 10px;border-radius:20px}.flash{min-height:210px;display:flex;flex-direction:column;justify-content:center;text-align:center}table{width:100%;border-collapse:collapse;font-size:15px}td,th{text-align:left;padding:10px;border-bottom:1px solid #dbe5ea}summary{cursor:pointer;font-weight:650}details p{margin-bottom:0}[hidden]{display:none!important}footer{text-align:center;color:#587084;font-size:13px;margin-top:25px}@media(max-width:500px){.card{padding:19px}table{font-size:13px}td,th{padding:6px}button{padding:10px 13px}}
</style></head><body><header><div><span class="pill">GREENBAUM • 2026 REVIEW</span><h1>Chemistry Test 1</h1><p>Learn the ideas. Test yourself. Review what needs work.</p></div></header><main><nav aria-label="Study modes"><button class="active" data-mode="quiz">Practice quiz</button><button data-mode="flash">Flashcards</button><button data-mode="study">Study guide</button></nav><section id="app" aria-live="polite"></section><footer>Based on the supplied Chemistry Test 1 review. No account needed. Scores stay in this session.</footer></main><script>
const questions=[
{t:'Atomic structure',q:'Which particle is positively charged and located in the nucleus?',o:['Electron','Proton','Neutron','Atom'],a:1,h:'Compare the charges of the three subatomic particles.',e:'A proton has a positive charge and is in the nucleus. Neutrons are neutral; electrons are negative and outside the nucleus.'},
{t:'Atomic structure',q:'Which subatomic particle has the least mass?',o:['Proton','Neutron','Electron','Protons and neutrons equally'],a:2,h:'The nucleus contains nearly all of an atom’s mass.',e:'Electrons have much less mass than either protons or neutrons.'},
{t:'Atomic structure',q:'A neutral atom has atomic number 11 and mass number 23. How many neutrons does it have?',o:['11','23','34','12'],a:3,h:'Subtract atomic number from mass number.',e:'Neutrons = 23 − 11 = 12. Atomic number gives the proton count.'},
{t:'Atomic structure',q:'A neutral atom has 15 protons and 16 neutrons. How many electrons does it have?',o:['15','16','31','1'],a:0,h:'Neutral means the positive and negative charges balance.',e:'A neutral atom has equal numbers of protons and electrons, so it has 15 electrons.'},
{t:'Atomic structure',q:'An atom has 6 protons and 8 neutrons. What is its mass number?',o:['6','14','8','2'],a:1,h:'Add the two types of particles in the nucleus.',e:'Mass number = protons + neutrons = 6 + 8 = 14.'},
{t:'Atomic structure',q:'Which count determines an atom’s element?',o:['Neutrons','All particles','Protons','Valence electrons'],a:2,h:'Think about atomic number.',e:'The proton count, or atomic number, identifies the element.'},
{t:'Bohr models',q:'A model has 9 protons and 10 neutrons. Atomic number 9 belongs to fluorine. What are its element and mass number?',o:['Fluorine; 10','Fluorine; 9','Neon; 19','Fluorine; 19'],a:3,h:'Use protons for identity and protons plus neutrons for mass number.',e:'The 9 protons identify fluorine. Mass number = 9 + 10 = 19.'},
{t:'Bohr models',q:'An atom has 2 electrons in the inner shell and 7 in the outermost shell. How many valence electrons does it have?',o:['7','9','2','5'],a:0,h:'Count only the outermost occupied shell.',e:'Valence electrons are in the outermost occupied shell, which contains 7. There are 9 electrons in total.'},
{t:'Bohr models',q:'An atom’s shells contain 2, 8, and 1 electron. How many valence electrons does it have?',o:['11','1','8','2'],a:1,h:'The last occupied shell is the outermost one.',e:'The outermost occupied shell contains 1 electron, so there is 1 valence electron.'},
{t:'Matter',q:'What is matter?',o:['Only things you can see','Anything that gives off light','Anything with mass that takes up space','Only solids and liquids'],a:2,h:'Gases count as matter too.',e:'Matter has mass and takes up space. Solids, liquids, and gases all count.'},
{t:'Matter',q:'Why is pure oxygen gas, O₂, an element?',o:['It contains one atom','It has no chemical bonds','It is physically mixed','It contains only one type of atom'],a:3,h:'An element may have atoms bonded to other atoms of the same element.',e:'Both atoms in O₂ are oxygen. Having two atoms does not make it a compound.'},
{t:'Matter',q:'Pure water, H₂O, is a…',o:['Compound','Element','Heterogeneous mixture','Homogeneous mixture'],a:0,h:'Hydrogen and oxygen are chemically bonded in a fixed ratio.',e:'Water is a compound of two different elements, chemically bonded in a 2:1 atom ratio.'},
{t:'Matter',q:'Lemonade powder fully dissolved and evenly distributed in water is a…',o:['Compound','Homogeneous mixture','Element','Heterogeneous mixture'],a:1,h:'The drink is uniform throughout.',e:'The ingredients are physically combined and evenly distributed: a homogeneous mixture.'},
{t:'Matter',q:'A salad with visibly different ingredients is a…',o:['Element','Compound','Heterogeneous mixture','Homogeneous mixture'],a:2,h:'Consider whether every part of it is the same.',e:'Salad has distinct, nonuniform parts and is a heterogeneous mixture.'},
{t:'Formulas',q:'How many sodium atoms are in one formula unit of Na₂S?',o:['1','3','4','2'],a:3,h:'The subscript belongs to the element immediately before it.',e:'The subscript 2 after Na means 2 sodium atoms. S has no subscript, so there is 1 sulfur atom.'},
{t:'Formulas',q:'How many hydrogen and oxygen atoms are represented by 3H₂O?',o:['6 hydrogen; 3 oxygen','2 hydrogen; 1 oxygen','6 hydrogen; 1 oxygen','3 hydrogen; 6 oxygen'],a:0,h:'The coefficient multiplies every atom count in the formula.',e:'Hydrogen: 3 × 2 = 6. Oxygen: 3 × 1 = 3.'},
{t:'Formulas',q:'How many total atoms are represented by 2CO₂?',o:['3','6','4','5'],a:1,h:'Count each element, then add the counts.',e:'There are 2 carbon atoms and 4 oxygen atoms, for 6 total atoms.'},
{t:'Formulas',q:'How do CO₂ and 2CO differ in atom counts?',o:['Both have 1 C and 2 O','CO₂ has 2 C; 2CO has 1 C','CO₂ has 1 C and 2 O; 2CO has 2 C and 2 O','CO₂ has 1 C and 2 O; 2CO has 2 C and 4 O'],a:2,h:'A subscript and a coefficient apply in different ways.',e:'CO₂ has 1 carbon and 2 oxygen. The coefficient in 2CO multiplies both C and O, giving 2 of each.'},
{t:'Changes',q:'Why is boiling water a physical change?',o:['Heating never causes reactions','Bubbles always mean physical change','It becomes a new compound','It changes state but stays H₂O'],a:3,h:'Ask whether a new substance forms.',e:'Liquid water becomes water vapor, but both are H₂O. Its chemical identity stays the same.'},
{t:'Changes',q:'Which situation is a chemical change?',o:['Iron rusting','Paper tearing','Ice melting','Metal bending'],a:0,h:'Look for formation of a new substance.',e:'Rusting forms new substances. The other choices change size, shape, or state without changing the substance’s identity.'},
{t:'Changes',q:'Sugar dissolving in water is classified in this review as a…',o:['Chemical change','Physical change','New element forming','Nuclear change'],a:1,h:'The sugar is dispersed in water but remains sugar.',e:'Dissolving sugar is a physical change: no new substance forms.'},
{t:'Changes',q:'Why is a banana spoiling a chemical change?',o:['It only changes shape','Its atoms disappear','Reactions create new substances','It only changes state'],a:2,h:'A new smell can be a clue about what has formed.',e:'Spoiling involves reactions that create new substances, including ones causing the new smell.'},
{t:'Changes',q:'Baking soda and vinegar react and produce carbon dioxide gas. This is a…',o:['Physical change because bubbles form','Physical change because ingredients mix','State change only','Chemical change because new substances form'],a:3,h:'The prompt identifies a reaction product.',e:'The reaction forms new substances, including carbon dioxide, so it is chemical. Bubbles alone do not prove a chemical change.'},
{t:'Atomic structure',q:'Argon has atomic number 18 and mass number 40. How many neutrons does this atom have?',o:['22','18','40','58'],a:0,h:'Remove the protons from the nucleus’s total particle count.',e:'Neutrons = mass number − atomic number = 40 − 18 = 22.'}
];
const cards=[['Atomic number','The number of protons. It identifies the element.'],['Mass number','Protons + neutrons for one atom.'],['Neutrons','Mass number − atomic number.'],['Neutral atom','Equal numbers of protons and electrons.'],['Proton','Positive charge; nucleus; relative mass about 1.'],['Neutron','Neutral; nucleus; relative mass about 1.'],['Electron','Negative charge; outside the nucleus; very small mass.'],['Valence electrons','Electrons in the outermost occupied shell.'],['Element','Only one type of atom, such as Au or O₂.'],['Compound','Different elements chemically bonded in a fixed ratio, such as H₂O.'],['Homogeneous mixture','Physically combined and evenly mixed throughout.'],['Heterogeneous mixture','Physically combined with visibly different parts.'],['Subscript','Counts atoms of the element immediately before it.'],['Coefficient','Multiplies every atom count in the formula.'],['Physical change','The substance stays the same; size, shape, state, or distribution changes.'],['Chemical change','New substances form.']];
let mode='quiz',set=[],at=0,answers=[],revealed=false,flashAt=0;
const app=document.getElementById('app');
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(pool=questions){set=shuffle(pool);at=0;answers=[];renderQuiz()}
function score(){return answers.filter((v,i)=>v===set[i].a).length}
function renderQuiz(){
 if(at===set.length){const missed=set.filter((q,i)=>answers[i]!==q.a);app.innerHTML=`<div class="card"><span class="pill">ROUND COMPLETE</span><h2>${score()} / ${set.length} correct</h2><p>${missed.length?'Review your missed questions below, then try them again.':'You answered every question correctly. Try a shuffled round to check your recall.'}</p><div class="row"><button class="primary" id="again">New full round</button>${missed.length?'<button id="missed">Retry missed questions</button>':''}</div></div>`;document.getElementById('again').onclick=()=>start();if(missed.length)document.getElementById('missed').onclick=()=>start(missed);for(const q of missed){const card=document.createElement('div');card.className='card';const h=document.createElement('h3');h.textContent=q.q;const p=document.createElement('p');p.textContent=q.e;card.append(h,p);app.append(card)}return}
 const q=set[at],done=answers[at]!==undefined;
 app.innerHTML=`<div class="row"><span class="pill">${q.t}</span><span class="muted">${at+1} / ${set.length} · Score: ${score()}</span></div><progress value="${at}" max="${set.length}" aria-label="Quiz progress"></progress><div class="card"><h2 id="question"></h2><div class="options" id="choices"></div><details><summary>Show a hint</summary><p id="hint"></p></details><div id="feedback" class="feedback" ${done?'':'hidden'}></div><div class="row" style="margin-top:20px"><button id="next" class="primary" ${done?'':'disabled'}>${at===set.length-1?'See results':'Next question'}</button><button id="restart">Restart quiz</button></div></div>`;
 document.getElementById('question').textContent=q.q;document.getElementById('hint').textContent=q.h;
 q.o.forEach((o,i)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+'. '+o;b.disabled=done;if(done&&i===q.a)b.className='good';if(done&&i===answers[at]&&i!==q.a)b.className='bad';b.onclick=()=>{answers[at]=i;renderQuiz()};document.getElementById('choices').append(b)});
 if(done)document.getElementById('feedback').textContent=(answers[at]===q.a?'Correct. ':'The correct answer is '+q.o[q.a]+'. ')+q.e;
 document.getElementById('next').onclick=()=>{at++;renderQuiz()};document.getElementById('restart').onclick=()=>start();
}
function renderFlash(){app.innerHTML=`<div class="row"><span class="pill">RECALL BEFORE REVEALING</span><span class="muted">${flashAt+1} / ${cards.length}</span></div><div class="card flash"><h2 id="term"></h2><p id="definition" ${revealed?'':'hidden'}></p><button class="primary" id="flip">${revealed?'Hide answer':'Reveal answer'}</button></div><div class="row"><button id="prev">Previous card</button><button id="fnext">Next card</button></div>`;document.getElementById('term').textContent=cards[flashAt][0];document.getElementById('definition').textContent=cards[flashAt][1];document.getElementById('flip').onclick=()=>{revealed=!revealed;renderFlash()};document.getElementById('prev').onclick=()=>{flashAt=(flashAt+cards.length-1)%cards.length;revealed=false;renderFlash()};document.getElementById('fnext').onclick=()=>{flashAt=(flashAt+1)%cards.length;revealed=false;renderFlash()}}
function renderStudy(){app.innerHTML=`<div class="card"><h2>Atomic structure</h2><table><tr><th>Particle</th><th>Charge</th><th>Location</th><th>Mass</th></tr><tr><td>Proton</td><td>Positive</td><td>Nucleus</td><td>About 1</td></tr><tr><td>Neutron</td><td>Neutral</td><td>Nucleus</td><td>About 1</td></tr><tr><td>Electron</td><td>Negative</td><td>Outside nucleus</td><td>Very small</td></tr></table><p><b>Atomic number = protons.</b><br><b>Mass number = protons + neutrons.</b><br><b>Neutrons = mass number − atomic number.</b><br>In a <b>neutral atom</b>, electrons = protons.</p><p class="muted">The packet calls protons + neutrons “atomic mass.” More precisely, this is mass number. A periodic table’s decimal atomic mass is an average.</p><details><summary>Worked example: sodium-23</summary><p>Atomic number 11 → 11 protons and, if neutral, 11 electrons. Mass number 23 → 23 − 11 = 12 neutrons.</p></details></div><div class="card"><h2>Bohr models</h2><p>Use the proton count to identify the element. Add protons and neutrons for the mass number. Count only the electrons in the outermost occupied shell for <b>valence electrons</b>.</p><p>The original review’s model: <b>9 protons + 10 neutrons → fluorine, mass number 19.</b> Its 2 inner electrons and 7 outer electrons give 9 total and <b>7 valence electrons</b>.</p></div><div class="card"><h2>Types of matter</h2><p><b>Matter:</b> anything with mass that takes up space.</p><p><b>Element:</b> one type of atom. Au and O₂ are elements.<br><b>Compound:</b> different elements chemically bonded in a fixed ratio. H₂O and NaCl are compounds.<br><b>Mixture:</b> substances physically combined.</p><p><b>Homogeneous:</b> evenly mixed, like fully dissolved lemonade.<br><b>Heterogeneous:</b> visibly different parts, like salad.</p></div><div class="card"><h2>Counting atoms</h2><p>A <b>subscript</b> applies to the element before it. No subscript means 1. A <b>coefficient</b> multiplies every element in the formula.</p><table><tr><th>Formula</th><th>Atom counts</th></tr><tr><td>CO₂</td><td>1 carbon + 2 oxygen</td></tr><tr><td>H₂O</td><td>2 hydrogen + 1 oxygen</td></tr><tr><td>Na₂S</td><td>2 sodium + 1 sulfur</td></tr><tr><td>2CO</td><td>2 carbon + 2 oxygen</td></tr><tr><td>3H₂O</td><td>6 hydrogen + 3 oxygen</td></tr></table></div><div class="card"><h2>Physical or chemical?</h2><p><b>Physical:</b> same substance after a change. Examples: melting ice, boiling water, bending metal, tearing paper, dissolving sugar.</p><p><b>Chemical:</b> new substances form. Examples: rusting, burning, spoiling, cooking an egg, baking a cake, baking soda reacting with vinegar.</p><details><summary>Why boiling is physical</summary><p>Liquid water becomes water vapor, but both are H₂O. Bubbles can occur in physical changes or chemical reactions; use the full situation.</p></details><details><summary>Why spoiling is chemical</summary><p>Reactions form new substances, including those responsible for the banana’s new smell.</p></details></div>`}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(n=>n.classList.toggle('active',n===b));if(mode==='quiz')renderQuiz();else if(mode==='flash')renderFlash();else renderStudy()});start();
</script></body></html>
